# 自动打包：Windows x64（NSIS）；Microsoft Store MSIX（x64 + arm64）
#
# 触发：推 v* tag（打包 NSIS 并发布 Release + latest.json）或手动 dispatch（可勾选额外构建 MSIX）
# 说明：Windows 端在没有 TAURI_SIGNING_PRIVATE_KEY 时自动关闭 updater 产物，产物可用但应用内更新不生效
#
# 需要配置的仓库 Secrets（可选）：
#   TAURI_SIGNING_PRIVATE_KEY             Tauri updater 私钥；不配则 Windows 产物不带 .sig
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD    可选，私钥口令
#
# 需要配置的仓库 Variables（仅 MSIX）：
#   MSIX_IDENTITY_NAME             Partner Center 分配的 Package/Identity/Name
#   MSIX_PUBLISHER                 Partner Center 分配的 Publisher（CN=...）
#   MSIX_PUBLISHER_DISPLAY_NAME    Partner Center 分配的发布者显示名
#
# 版本号从 src-tauri/tauri.conf.json 读取，tag 必须为 v<版本号>

name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_store:
        description: 额外出 Microsoft Store MSIX（x64 + arm64，需配置 MSIX_* Variables）
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.15.0"

jobs:
  windows:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          # 缓存 pnpm store，避免每次 job 从零装依赖
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows-x64
          cache-on-failure: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 读取版本号
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "构建版本: $version"

      - name: 构建安装包
        shell: pwsh
        run: |
          # createUpdaterArtifacts 为 true 时，缺少私钥会让 tauri build 在打包完成后报错终止
          $extra = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，本次产物不含 updater 签名，应用内自动更新对本次安装包不生效"
            $extra = @("--config", '{"bundle":{"createUpdaterArtifacts":false}}')
          }
          pnpm tauri build --bundles nsis @extra

      - name: 归档产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction Stop | Select-Object -First 1
          $name = "florime_${env:APP_VERSION}_x64-setup.exe"
          Copy-Item $exe.FullName "out/$name"
          # updater 签名：有私钥时 tauri 会生成 <安装包>.exe.sig，必须一起归档
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "out/$name.sig"
            Write-Host "已归档 updater 签名: $($sig.Name)"
          } else {
            Write-Host "::warning::未生成 .sig，本次安装包无法用于应用内自动更新"
          }
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: out/*
          if-no-files-found: error

  windows-store:
    name: Windows MSIX x64 + arm64
    # hosted runner 需具备 Visual Studio 的 MSVC ARM64/ARM64EC 与 C++ Clang 组件；
    # 脚本在缺少这些组件时会主动报错，不会产出残缺包。
    if: inputs.build_store
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v7

      - name: 校验 MSIX 身份配置
        shell: pwsh
        run: |
          foreach ($name in @("MSIX_IDENTITY_NAME", "MSIX_PUBLISHER", "MSIX_PUBLISHER_DISPLAY_NAME")) {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              throw "缺少仓库 Variable $name，请在 Settings → Secrets and variables → Actions → Variables 中配置"
            }
          }

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: windows-msix
          cache-on-failure: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 MSIX 安装包
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/build-microsoft-store.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: src-tauri/target/microsoft-store/*.msixbundle
          if-no-files-found: error

  release:
    name: 发布 Release 与 latest.json
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 校验版本与签名
        run: |
          set -euo pipefail
          ls -l dist

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} 与 tauri.conf.json 版本 ${version} 不一致"
            exit 1
          fi

          exe="dist/florime_${version}_x64-setup.exe"
          sig="${exe}.sig"
          if [ ! -s "$exe" ] || [ ! -s "$sig" ]; then
            echo "::error::缺少安装包或签名文件（$exe / $sig），无法发布可更新的版本"
            exit 1
          fi

          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "SIGNATURE_FILE=${sig}" >> "$GITHUB_ENV"

      - name: 生成 latest.json
        run: |
          node scripts/generate-latest-json.mjs "$APP_VERSION" "$SIGNATURE_FILE" dist/latest.json
          cat dist/latest.json

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/florime_${APP_VERSION}_x64-setup.exe" \
            dist/latest.json \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
